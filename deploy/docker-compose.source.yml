services:
  lanqin-email:
    environment:
      LANQIN_UPDATE_SERVICE_URL: ""
    build:
      context: ./source
      dockerfile: deploy/all-in-one/Dockerfile
      args:
        APP_VERSION: ${LANQIN_BUILD_VERSION:-dev}
        APP_COMMIT: ${LANQIN_BUILD_COMMIT:-local}
        VITE_APP_VERSION: ${LANQIN_BUILD_VERSION:-dev}
        VITE_RELEASE_URL: ${LANQIN_BUILD_RELEASE_URL:-https://gitea.xzys.me/szx/NewSzxcn-Email-Bulk/releases}
